[package]
name = "beamlab-leo"
version = "2.4.0-beta.6"
description = "BeamLab LEO: simulador de beamforming satelital LEO"
authors = ["Jhorel Kennedy Cornejo Cruz <https://github.com/gcrownv-glitch>"]
license = "MIT"
repository = "https://github.com/gcrownv-glitch/beamlab-leo"
edition = "2021"
rust-version = "1.82"

[lib]
name = "beamlab_leo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
