name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/bump-version.mjs --check
      - run: npm test
      - run: npm run build
      - run: node scripts/build-portable.mjs
      - run: |
          cp -f release/portable/BeamLabLEO-*.html dist/ 2>/dev/null || true
          cp -f docs/portable/versions.json dist/
          cp -f release/*.zip dist/ 2>/dev/null || true
          cp -f portable/Actualizar.cmd portable/Actualizar.ps1 portable/LEEME.txt dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
