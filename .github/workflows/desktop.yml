name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verificar versiones, pruebas y build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/bump-version.mjs --check
      - run: npm test
      - run: npm run build

  linux:
    name: Linux · Ubuntu · deb + AppImage
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: BeamLabLEO-linux-ubuntu
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS · Apple Silicon cross · dmg
    needs: [verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npx tauri build --target aarch64-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BeamLabLEO-macos-arm64
          if-no-files-found: error
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows · nsis + portable exe + zip
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-portable.mjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-launcher.ps1
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: BeamLabLEO-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/beamlab-leo.exe
            release/BeamLabLEO-*.zip
            release/portable/BeamLabLEO-*.html

  release:
    name: Publicar artefactos en GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BeamLab LEO ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
          body: |
            BeamLab LEO ${{ github.ref_name }}.

            - Windows: instalador NSIS (`*-setup.exe`), ejecutable portable Tauri (`beamlab-leo.exe`) y paquete HTML/ZIP portable (`BeamLabLEO-*-portable.zip`).
            - macOS Apple Silicon: paquete `.dmg`.
            - Linux Ubuntu: paquetes `.AppImage` y `.deb`.
            - Web y catálogo de versiones: https://gcrownv-glitch.github.io/beamlab-leo/versiones.html

            Las etiquetas `-beta.*` se publican como **pre-release** manteniendo la última versión estable (`v2.3.4`) intacta.
            Artefactos sin firma comercial: macOS puede pedir clic derecho → Abrir.
